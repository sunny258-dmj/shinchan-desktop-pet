<!doctype html><meta charset="utf-8"><title>小新 · 动作重设计</title>
<style>body{background:#e0e8e9;color:#3e332c;font:16px "Microsoft YaHei";max-width:940px;margin:45px auto}button,select{font:inherit;padding:10px;border:1px solid #a89b86;border-radius:12px;background:#fff8e5}main{display:flex;align-items:center;gap:60px}.stage{width:384px;height:450px;display:grid;place-items:center;border-radius:28px;background:#fff7e5}.stage img{width:300px}p{line-height:1.8}#counter{font-size:13px}</style>
<h1>小新 · 动作重设计</h1><p>每组动作按独立节奏播放；可暂停逐帧检查。右侧为实际 Qt 气泡与桌宠的组合截图。</p>
<select id="state"></select> <button id="pause">暂停</button> <button id="step">下一帧</button> <button id="bg">切换深色背景</button>
<main><div><div class="stage"><img id="pet"></div><p id="counter"></p></div><img src="redesign-companion.png" style="max-width:350px"></main>
<script>const clips={"idle": [{"src": "v2-frames/idle-0.png", "duration": 1250}, {"src": "v2-frames/idle-1.png", "duration": 260}, {"src": "v2-frames/idle-2.png", "duration": 360}, {"src": "v2-frames/idle-3.png", "duration": 220}, {"src": "v2-frames/idle-4.png", "duration": 400}, {"src": "v2-frames/idle-5.png", "duration": 240}, {"src": "v2-frames/idle-6.png", "duration": 360}, {"src": "v2-frames/idle-7.png", "duration": 900}], "waving": [{"src": "v2-frames/waving-0.png", "duration": 200}, {"src": "v2-frames/waving-1.png", "duration": 170}, {"src": "v2-frames/waving-2.png", "duration": 200}, {"src": "v2-frames/waving-3.png", "duration": 170}, {"src": "v2-frames/waving-4.png", "duration": 230}, {"src": "v2-frames/waving-5.png", "duration": 220}, {"src": "v2-frames/waving-6.png", "duration": 180}, {"src": "v2-frames/waving-7.png", "duration": 350}], "jumping": [{"src": "v2-frames/jumping-0.png", "duration": 200}, {"src": "v2-frames/jumping-1.png", "duration": 110}, {"src": "v2-frames/jumping-2.png", "duration": 110}, {"src": "v2-frames/jumping-3.png", "duration": 130}, {"src": "v2-frames/jumping-4.png", "duration": 170}, {"src": "v2-frames/jumping-5.png", "duration": 120}, {"src": "v2-frames/jumping-6.png", "duration": 160}, {"src": "v2-frames/jumping-7.png", "duration": 700}], "waiting": [{"src": "v2-frames/waiting-0.png", "duration": 900}, {"src": "v2-frames/waiting-1.png", "duration": 260}, {"src": "v2-frames/waiting-2.png", "duration": 500}, {"src": "v2-frames/waiting-3.png", "duration": 240}, {"src": "v2-frames/waiting-4.png", "duration": 400}, {"src": "v2-frames/waiting-5.png", "duration": 450}, {"src": "v2-frames/waiting-6.png", "duration": 300}, {"src": "v2-frames/waiting-7.png", "duration": 1000}], "running": [{"src": "v2-frames/running-0.png", "duration": 200}, {"src": "v2-frames/running-1.png", "duration": 180}, {"src": "v2-frames/running-2.png", "duration": 180}, {"src": "v2-frames/running-3.png", "duration": 180}, {"src": "v2-frames/running-4.png", "duration": 240}, {"src": "v2-frames/running-5.png", "duration": 300}, {"src": "v2-frames/running-6.png", "duration": 380}, {"src": "v2-frames/running-7.png", "duration": 260}, {"src": "v2-frames/running-8.png", "duration": 220}], "review": [{"src": "v2-frames/review-0.png", "duration": 350}, {"src": "v2-frames/review-1.png", "duration": 300}, {"src": "v2-frames/review-2.png", "duration": 400}, {"src": "v2-frames/review-3.png", "duration": 280}, {"src": "v2-frames/review-4.png", "duration": 400}, {"src": "v2-frames/review-5.png", "duration": 300}, {"src": "v2-frames/review-6.png", "duration": 400}, {"src": "v2-frames/review-7.png", "duration": 450}], "hero-celebrate": [{"src": "v2-frames/hero-celebrate-0.png", "duration": 200}, {"src": "v2-frames/hero-celebrate-1.png", "duration": 110}, {"src": "v2-frames/hero-celebrate-2.png", "duration": 110}, {"src": "v2-frames/hero-celebrate-3.png", "duration": 130}, {"src": "v2-frames/hero-celebrate-4.png", "duration": 170}, {"src": "v2-frames/hero-celebrate-5.png", "duration": 120}, {"src": "v2-frames/hero-celebrate-6.png", "duration": 160}, {"src": "v2-frames/hero-celebrate-7.png", "duration": 1000}], "thinking": [{"src": "v2-frames/thinking-0.png", "duration": 320}, {"src": "v2-frames/thinking-1.png", "duration": 450}, {"src": "v2-frames/thinking-2.png", "duration": 450}, {"src": "v2-frames/thinking-3.png", "duration": 520}, {"src": "v2-frames/thinking-4.png", "duration": 360}, {"src": "v2-frames/thinking-5.png", "duration": 450}, {"src": "v2-frames/thinking-6.png", "duration": 300}, {"src": "v2-frames/thinking-7.png", "duration": 700}]};const names={idle:'待机 · 伸展',running:'工作 · 敲键检查',thinking:'思考 · 托腮挠头',waiting:'等待 · 指向气泡',review:'检查 · 翻看记录',jumping:'跳跃 · 蓄力落地','hero-celebrate':'庆祝 · 竖起拇指',waving:'互动 · 举手招呼'};
const sel=document.querySelector('#state'),img=document.querySelector('#pet');for(const k in clips)sel.add(new Option(names[k],k));let idx=0,paused=false,timer;function draw(){clearTimeout(timer);let f=clips[sel.value][idx];img.src=f.src;document.querySelector('#counter').textContent=`${idx+1} / ${clips[sel.value].length} 帧 · ${f.duration} ms`;if(!paused)timer=setTimeout(()=>{idx=(idx+1)%clips[sel.value].length;draw()},f.duration)}sel.onchange=()=>{idx=0;draw()};document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'播放':'暂停';draw()};document.querySelector('#step').onclick=()=>{paused=true;document.querySelector('#pause').textContent='播放';idx=(idx+1)%clips[sel.value].length;draw()};let dark=false;document.querySelector('#bg').onclick=()=>{dark=!dark;document.querySelector('.stage').style.background=dark?'#243246':'#fff7e5'};draw();</script>
